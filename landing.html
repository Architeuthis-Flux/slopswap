<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slopswap</title>
<meta name="description" content="Calculators, field guides and bench notes made with Claude, parked here so the links open anywhere.">
<link rel="stylesheet" href="styles/jumperless.css">
<style>
/* slopswap.org front page. build.py fills the three double-brace placeholders in the body (latest, stats, projects);
   everything else is edited here.
   Layout: the logo on the left with the name and the newest pages beside it; below, every project as one
   row of a rainbow index, most recently touched first. On phones it all stacks in that order.
   The rows and labels are the theme's .ix-rows and .ix-label, shared with the folder indexes. */
.hero{display:grid;grid-template-columns:minmax(0,21rem) minmax(0,1fr);gap:1.5rem 3.5rem;align-items:center;margin:.5rem 0 3.5rem}
.hero-logo{display:block;width:100%;height:auto}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:0 0 .75rem}
.hero .tag{font-size:1.1rem;color:var(--muted);max-width:34rem;margin:0 0 1.75rem}
.latest{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.latest li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:.15rem 1rem;margin:0;padding:.5rem 0;border-bottom:1px solid var(--line)}
.latest a{min-width:0;font-weight:700;text-decoration:none}
.latest a:hover{text-decoration:underline}
.latest small{font-family:var(--font-pixel);font-size:.5rem;line-height:1.8;color:var(--muted);white-space:nowrap}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 2rem;color:var(--muted);font-size:.9rem}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;margin-bottom:2.5rem}
  .hero-logo{max-width:17rem;margin:0 auto}
  .latest li{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="page wide">

<header class="hero">
  <img class="hero-logo" src="styles/architeuthis-flux.webp" width="800" height="940" alt="Architeuthis Flux">
  <div>
    <h1>slopswap</h1>
    <p class="tag">Calculators, field guides and bench notes made with Claude, parked here so the links open anywhere.</p>
    <p class="ix-label">RECENTLY UPDATED</p>
    <ol class="latest">
{{latest}}
    </ol>
  </div>
</header>

<p class="ix-label">{{stats}}</p>
<ul class="ix-rows cycle">
{{projects}}
</ul>

<footer class="foot">
  <span>Kevin Cappuccio · Architeuthis Flux</span>
  <span><a href="https://shop.jumperless.org">Shop</a> · <a href="https://docs.jumperless.org">Docs</a> · <a href="https://github.com/Architeuthis-Flux/slopswap">Source</a></span>
</footer>

</main>
</body>
</html>
