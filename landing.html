<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slopswap</title>
<meta name="description" content="Calculators, field guides and bench notes made with Claude, parked here so the links open anywhere.">
<link rel="stylesheet" href="styles/jumperless.css">
<style>
/* slopswap.org front page. build.py fills {{stats}}, {{latest}} and {{projects}}; everything else is edited here.
   Layout: the logo on the left with the name and the newest pages beside it; below, every project as one
   row of a rainbow index, most recently touched first. On phones it all stacks in that order. */
.hero{display:grid;grid-template-columns:minmax(0,21rem) minmax(0,1fr);gap:1.5rem 3.5rem;align-items:center;margin:.5rem 0 3.5rem}
.hero-logo{display:block;width:100%;height:auto}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:0 0 .75rem}
.hero .tag{font-size:1.1rem;color:var(--muted);max-width:34rem;margin:0 0 1.75rem}
.label{font-family:var(--font-pixel);font-size:.6rem;line-height:1.8;color:var(--muted);margin:0 0 .6rem}

.latest,.projects{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.latest li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:.15rem 1rem;margin:0;padding:.5rem 0;border-bottom:1px solid var(--line)}
.latest a{min-width:0;font-weight:700;text-decoration:none}
.latest a:hover{text-decoration:underline}
.latest small,.projects small{font-family:var(--font-pixel);font-size:.5rem;line-height:1.8;color:var(--muted);white-space:nowrap}

.projects li{position:relative;display:grid;grid-template-columns:15rem minmax(0,1fr) auto;gap:.3rem 1.5rem;align-items:baseline;margin:0;padding:1rem 1rem 1rem 1.25rem;border-bottom:1px solid var(--line);border-left:.375rem solid var(--c,var(--accent))}
.projects li:hover,.projects li:focus-within{background:var(--surface)}
.projects h2{font-size:1.05rem;line-height:1.3;margin:0;padding:0;border:0;overflow-wrap:anywhere}
.projects h2 a{color:var(--fg);color:color-mix(in srgb,var(--c,var(--accent)) 68%,#fff);text-decoration:none}
.projects h2 a::after{content:"";position:absolute;inset:0}
.projects p{margin:0;color:var(--muted);font-size:.95rem;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.projects small{text-align:right}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 2rem;margin-top:2.5rem;color:var(--muted);font-size:.9rem}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;margin-bottom:2.5rem}
  .hero-logo{max-width:17rem;margin:0 auto}
  .latest li,.projects li{grid-template-columns:1fr}
  .projects li{padding-right:.5rem}
  .projects small{text-align:left}
}
</style>
</head>
<body>
<main class="page wide">

<header class="hero">
  <img class="hero-logo" src="styles/jumperless-af.webp" width="800" height="915" alt="Jumperless, by Architeuthis Flux">
  <div>
    <h1>slopswap</h1>
    <p class="tag">Calculators, field guides and bench notes made with Claude, parked here so the links open anywhere.</p>
    <p class="label">RECENTLY UPDATED</p>
    <ol class="latest">
{{latest}}
    </ol>
  </div>
</header>

<p class="label">{{stats}}</p>
<ul class="projects cycle">
{{projects}}
</ul>

<footer class="foot">
  <span>Kevin Cappuccio · Architeuthis Flux</span>
  <span><a href="https://shop.jumperless.org">Shop</a> · <a href="https://docs.jumperless.org">Docs</a> · <a href="https://github.com/Architeuthis-Flux/slopswap">Source</a></span>
</footer>

</main>
</body>
</html>
