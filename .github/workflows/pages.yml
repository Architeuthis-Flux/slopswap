name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
# Two jobs on purpose. Asked for the upload a split second after making it, GitHub sometimes
# answers 'No artifacts named "github-pages"' and the deploy fails; the pause between two jobs is
# enough for it to appear. If a run does fail, start a new one (Run workflow) instead of re-running
# it: a re-run has been seen to upload a second copy and fail with "Multiple artifacts".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.py dates pages by the commit that added them
      - run: python3 build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
