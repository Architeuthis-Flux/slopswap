<!doctype html>
<html lang="en" class="console">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V6 notebook</title>
<meta name="short-title" content="V6 notebook">
<meta name="description" content="The Jumperless V6 tools on one page: the board outline, the magnetometer layout, the routing lab and the cost explorer as tabs, with a whole design kept as a named page to come back to.">
<link rel="stylesheet" href="../styles/jumperless.css">
<style>
/* The notebook is a bar over one tool at a time. Each tool is its own page in a frame, so it also opens alone at
   its own address and a newer copy of it drops in with nothing to redo here. The look is the site's console. */
html, body { height: 100%; }
[hidden] { display: none !important; }
body { display: flex; flex-direction: column; padding-top: 3px; overflow: hidden; }
.top { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 6px 10px; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.top .spacer { flex: 1; }
.top .group { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.top select, .top input { max-width: 16em; }
#copper-box[hidden], #ask[hidden] { display: none; }
#said { flex: 1 0 100%; min-height: 1.35em; color: var(--dim); font-size: 12px; }
#frames { flex: 1 1 0; min-height: 0; position: relative; background: var(--bg); }
#frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
#frames iframe[hidden] { display: none; }
@media (max-width: 700px) {
  /* a phone: the bar is three short lines. The tabs; the page; then which copper (on the Routing tab), what just
     happened, and where this page is, after the linked box. A line too long for the screen scrolls sideways instead of
     wrapping. */
  .top { padding: 5px 8px; gap: 5px 8px; }
  .top h1, .top .spacer { display: none; }
  .tabs { order: 1; flex: 1 0 100%; }
  #pages, #ask { order: 2; flex: 1 0 100%; }
  #link-box, #copper-box { order: 3; }
  #said { order: 4; flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top > .eyebrow { order: 5; }
  #copper-box:not([hidden]) ~ #said { min-width: 60%; }      /* with the copper on that line, what happened goes to the next, beside the crumb */
  .tabs, .top .group { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .tabs::-webkit-scrollbar, .top .group::-webkit-scrollbar { display: none; }
  .tabs button, .top .group > * { flex: none; }
}
</style>
</head>
<body>
<header class="top">
  <span class="eyebrow"><a href="../">slopswap</a> / <a href="./">V6</a></span>
  <h1>V6 notebook</h1>
  <span class="tabs" role="tablist" aria-label="which tool is shown" id="tabs"></span>
  <span class="group" id="copper-box" hidden>
    <label class="eyebrow" for="copper">copper</label>
    <select id="copper" title="which run of the routing lab is shown. Each was routed ahead of time: the page shows a run, it does not route."></select>
  </span>
  <label class="group" id="link-box" title="Linked: the cost explorer follows the outline. Its display, the display's window, the expansion port and the number of magnetometers are set from the outline's design whenever that changes. Untick to price something the outline does not have."><input type="checkbox" id="linked" checked> <span class="eyebrow">linked</span></label>
  <span class="spacer"></span>
  <span class="group" id="pages">
    <label class="eyebrow" for="page">page</label>
    <select id="page" title="a notebook page is a whole design: what every tool was set to when you left it. Picking another page puts this one away as it is and opens that one in every tab."></select>
    <button type="button" id="nb-sync" class="quiet"></button>
    <button type="button" id="pg-copy" title="a second page that starts as a copy of this one">Copy as</button>
    <button type="button" id="pg-blank" title="a new page with every tool at its built-in design">Blank</button>
    <button type="button" id="pg-rename" class="quiet">Rename</button>
    <button type="button" id="pg-delete" class="quiet">Delete</button>
    <button type="button" id="nb-export" class="quiet" title="every page of the notebook as one file, to keep or to open in another browser">Export</button>
    <button type="button" id="nb-import" class="quiet" title="add the pages of an exported notebook file to this one">Import</button>
    <input type="file" id="nb-file" accept=".json,application/json" hidden>
    <button type="button" id="nb-sync-off" class="quiet" hidden title="forget the key on this device. Its pages stay here and the account keeps its own.">Stop sync</button>
  </span>
  <span class="group" id="ask" hidden>
    <label class="eyebrow" for="ask-name" id="ask-what"></label>
    <input id="ask-name" maxlength="60" autocomplete="off">
    <button type="button" id="ask-ok" class="on"></button>
    <button type="button" id="ask-no" class="quiet">Cancel</button>
  </span>
  <span id="said" role="status"></span>
</header>
<main id="frames"></main>
<script src="notebook-sync.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const NB = 'v6nb.v1', KEY = 'v6nb.key', API = '../api/notebook';
  const S = self.NotebookSync;                       // how this device's pages and the account's become one set

  // The tools. Each keeps its working state in this browser under names of its own (keys); a notebook page is a
  // copy of those values, taken when the page is put away and written back when it is opened. Nothing in a tool
  // is changed for this. The four here are the ones the notebook does something more for (the copper picker, the
  // link); any other page of this folder joins by a tag in its own head, read below.
  const COPPER = [
    { id: 'v6-feed-off', name: 'V6, probe feed off', src: 'routing-lab-v6-feed-off.html' },
    { id: 'v5', name: 'V5 as built', src: 'routing-lab-v5.html' },
  ];
  const pathOf = (src) => new URL(src, location.href).pathname;
  const FRAMES = {
    outline: { title: 'Board outline', src: () => 'board-outline.html', keys: ['v6mech.state'] },
    routing: { title: 'Routing lab', src: () => (COPPER.find((c) => c.id === nb.copper) || COPPER[0]).src,
      keys: COPPER.map((c) => 'lab.ui.v1:' + pathOf(c.src)) },
    cost: { title: 'Cost explorer', src: () => 'cost-explorer.html', keys: ['v6ce.v4'] },
  };
  const TABS = [
    { id: 'outline', name: 'Outline', frame: 'outline', inner: 'tab-outline' },
    { id: 'mag', name: 'Magnetometers', frame: 'outline', inner: 'tab-mag' },
    { id: 'routing', name: 'Routing', frame: 'routing' },
    { id: 'cost', name: 'Cost', frame: 'cost' },
  ];
  // A page of this folder becomes a tab by saying so in its head, once for each tab it wants:
  //   <meta name="notebook-tab" content="Lite cost" data-inner="tab-lite" data-keys="v6lite.v1" data-order="10">
  // (the site's README, "The V6 notebook", says what each part is). The build reads those tags and puts the list in
  // this page's head, in order; opened unbuilt, the notebook has the four tabs above.
  let tagged = [];
  try { tagged = JSON.parse($('notebook-tabs').textContent); } catch (e) { /* unbuilt */ }
  const builtIn = ['board-outline.html', 'cost-explorer.html', ...COPPER.map((c) => c.src)];
  for (const t of Array.isArray(tagged) ? tagged : []) {
    if (!t || typeof t.id !== 'string' || !t.id || typeof t.src !== 'string' || !/^[\w.-]+\.html$/.test(t.src)) continue;
    if (builtIn.includes(t.src) || TABS.some((x) => x.id === t.id)) continue;       // a tab the notebook already has
    const f = FRAMES[t.src] || (FRAMES[t.src] = { title: String(t.name), src: () => t.src, keys: [] });
    for (const k of Array.isArray(t.keys) ? t.keys : []) if (typeof k === 'string' && k && k.indexOf(S.OWN) !== 0 && !f.keys.includes(k)) f.keys.push(k);
    TABS.push({ id: t.id, name: String(t.name), frame: t.src, inner: typeof t.inner === 'string' ? t.inner : undefined });
  }
  const KEYS = [...new Set(Object.values(FRAMES).flatMap((f) => f.keys))];

  // ---- this browser's storage. A private window may refuse it: the tabs still work, the pages do not last.
  let store = null;
  try { store = localStorage; store.setItem(NB + '.t', '1'); store.removeItem(NB + '.t'); } catch (e) { store = null; }
  const get = (k) => { try { return store ? store.getItem(k) : null; } catch (e) { return null; } };
  const put = (k, v) => { try { if (!store) return false; if (v == null) store.removeItem(k); else store.setItem(k, v); return true; } catch (e) { return false; } };
  const say = (words) => { $('said').textContent = words; };

  // nb: { pages: { name: { t, s, keys: { key: value or null }, copper } }, gone: { name: { s } }, current, tab, copper, linked }
  // t and s are for the account (V6/notebook-sync.js says how): t names the page's version, s the version the account
  // had when this device last agreed with it. gone holds the pages deleted here that the account still has.
  // The page named by current is the one the tools hold now: its truth is the tools' own keys, and its entry here
  // is brought up to date when it is put away. Every other page's truth is its entry.
  let nb = { pages: {}, gone: {}, current: null, tab: 'outline', copper: COPPER[0].id, linked: true };
  const keep = () => put(NB, JSON.stringify(nb));
  // what the tools hold now, as a page. A tool this copy of the notebook has no tab for keeps what `from` had of it.
  const snapshot = (from) => ({ t: Date.now(), copper: nb.copper, keys: { ...(from && from.keys), ...Object.fromEntries(KEYS.map((k) => [k, get(k)])) } });
  const names = () => Object.keys(nb.pages);
  // a page read from storage, from a file or from the account: text or nothing, under any names but the notebook's
  // own. It keeps the state of a tool this copy has no tab for (tabs come and go by tag, and another device may list
  // more), so a page is handed on whole; only the names in KEYS are ever written to this browser's storage.
  const clean = (p) => S.clean(p, COPPER.map((c) => c.id));
  // the same, and whatever it says of having been synced is not this device's
  const strange = (p) => { const c = clean(p); delete c.s; return c; };
  const cleanName = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 60);

  function load() {
    try {
      const o = JSON.parse(get(NB) || 'null');
      if (o && o.pages && typeof o.pages === 'object') {
        for (const [name, p] of Object.entries(o.pages)) { const n = cleanName(name); if (n) nb.pages[n] = clean(p); }
        if (nb.pages[o.current]) nb.current = o.current;
        if (TABS.some((t) => t.id === o.tab)) nb.tab = o.tab;
        if (COPPER.some((c) => c.id === o.copper)) nb.copper = o.copper;
        nb.linked = o.linked !== false;
        for (const [name, g] of Object.entries(o.gone && typeof o.gone === 'object' ? o.gone : {})) { const n = cleanName(name); if (n && g && typeof g.s === 'number') nb.gone[n] = { s: g.s }; }
      }
    } catch (e) { /* a notebook that does not read starts over; the tools' own state is untouched */ }
    if (!nb.current) {                       // the first visit, or a notebook that lost its place: what the tools hold is a page
      nb.current = names()[0] || 'Page 1';
      nb.pages[nb.current] = nb.pages[nb.current] || snapshot();
    }
    const want = location.hash.slice(1);
    if (TABS.some((t) => t.id === want)) nb.tab = want;
  }

  // ---- the link: the outline is the design, and the cost explorer prices it. What the two share goes one way, from
  // the outline's stored design into the cost explorer's own controls, so that its own handlers fill in the prices.
  // The names on the left are the outline's (src/catalog.js there), those on the right the cost explorer's.
  const LINK = {
    display: { display_amoled147: 'amoled', display_tft147: 'tft', display_tft220bar: 'bar22', display_ips279bar: 'bar279',
      display_ips165bar: 'bar165', display_tft225bar: 'bar225' },
    port: { m2_socket: 'm2', minipcie: 'mpcie', sodimm_ddr4: 'sodimm', pcie_x1_ra: 'pcie1', sfp_cage: null },
    covers: ['glass', 'oca', 'pmma', 'resin', 'vglass'],   // the cost explorer's kinds of pane; the outline only knows glass or none
  };
  // What a design says about the four shared things. undefined = nothing the cost explorer can price: left alone.
  function facts(params) {
    const parts = Array.isArray(params && params.parts) ? params.parts : [];
    const disp = parts.find((u) => /^display_/.test(u.type || ''));
    const port = parts.find((u) => Object.prototype.hasOwnProperty.call(LINK.port, u.type));
    const layout = params && params.show && params.show.sensor_layout, list = params && params.mag && params.mag.list;
    return {
      disp: disp ? LINK.display[disp.type] : 'none',
      win: !disp ? undefined : !disp.window ? 'open' : (disp.window.glass != null ? +disp.window.glass : 1) ? 'glass' : 'crop',
      port: port ? LINK.port[port.type] || undefined : 'pads',
      nmag: layout === 'plan18' ? 18 : layout === 'plan32' ? 32 : layout === 'custom' && Array.isArray(list) ? list.length : undefined,
    };
  }
  // Set the cost explorer to what the outline says. Returns what it changed, in words; null when the outline has
  // not kept a design in this browser yet.
  function follow() {
    let params; try { params = JSON.parse(get('v6mech.state')).params; } catch (e) { params = null; }
    if (!params) return null;
    const want = facts(params), did = [];
    try {
      const d = live.cost.contentDocument;
      const set = (id, v, name) => {
        const el = d.getElementById(id);
        if (!el || String(el.value) === String(v)) return;
        el.value = v;
        if (String(el.value) !== String(v)) return;          // a choice the cost explorer does not have
        for (const t of ['input', 'change']) el.dispatchEvent(new Event(t, { bubbles: true }));
        did.push(name + ' ' + (el.selectedOptions ? el.selectedOptions[0].textContent.split(/[(:,]/)[0].trim() : v));
      };
      if (want.disp !== undefined) {
        const b = d.querySelector('#disp button[data-v="' + want.disp + '"]');
        if (b && b.getAttribute('aria-pressed') !== 'true') { b.click(); did.push('display ' + b.textContent.trim()); }
      }
      if (want.win !== undefined && !(want.win === 'glass' && LINK.covers.includes(d.getElementById('win').value))) set('win', want.win, 'window:');
      if (want.port !== undefined && !(want.port === 'm2' && d.getElementById('port').value === 'm2g')) set('port', want.port, 'port:');
      if (want.nmag !== undefined) set('nmag', want.nmag, 'magnetometers');
    } catch (e) { /* the cost explorer is not ready: its next load asks again */ }
    return did;
  }
  function followNow() {
    if (!nb.linked || !live.cost) return;
    const did = follow();
    if (did === null) { if (nb.tab === 'cost') say('The cost explorer is not following the outline yet: open the Outline tab once, so this browser has its design.'); return; }
    if (did.length) say('Cost follows the outline: ' + did.join(', ') + '.');
  }

  // ---- newer copies. The build writes notebook.json beside this page: the version of every page of the folder
  // (a version is the page's own bytes and its sheets', so it changes only when the page does) and of the notebook
  // itself. It is asked for when the notebook opens, when it is come back to and once a minute while it is in view,
  // always past every cache, and a frame is loaded by its version (page.html?v=...), so no cache can hand it an old one.
  const OWN_V = (document.querySelector('meta[name="notebook-version"]') || {}).content || '';
  const IDLE = 15000, HANDS = ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'];
  let ver = {}, newer = '', toldNewer = false, touched = 0;      // page -> version as last asked; a newer notebook's version; when a hand was last here
  const at = (src) => (ver[src] ? src + '?v=' + ver[src] : src);
  const touch = () => { touched = Date.now(); };
  for (const t of HANDS) window.addEventListener(t, touch, { capture: true, passive: true });
  // What is newer comes in. A tool that is not in view loads again at once. The one in view, and the notebook itself,
  // load again when the page is come back to or when nothing in it has been touched for a while: never under a
  // hand. A tool is told it is being left first and keeps its own state, so what was set in it is still set.
  function refresh(back) {
    const calm = back || document.visibilityState !== 'visible' || Date.now() - touched > IDLE;
    if (newer && calm && !syncing && !asking) {
      let tried = null;
      try { tried = sessionStorage.getItem(NB + '.newer'); if (tried !== newer) { sessionStorage.setItem(NB + '.newer', newer); location.reload(); return; } } catch (e) { tried = newer; }
      if (!toldNewer) { toldNewer = true; say('A newer notebook is published, and this browser was handed the older one again. Reload the page in a minute.'); }
    }
    const did = [];
    for (const [name, f] of Object.entries(live)) {
      const to = at(FRAMES[name].src());
      if (f.dataset.at === to || (!f.hidden && !calm)) continue;
      try { f.contentWindow.dispatchEvent(new Event('pagehide')); } catch (e) { /* not loaded yet */ }
      point(name); did.push(FRAMES[name].title);
    }
    if (did.length) say('A newer ' + did.join(' and ') + ' was published: loaded, with everything as you had it.');
  }
  async function check(back) {
    try {
      const r = await fetch('notebook.json', { cache: 'no-store' });
      const o = r.ok ? await r.json() : null;
      if (o && o.v && typeof o.v === 'object') { ver = o.v; newer = OWN_V && typeof o.self === 'string' && o.self !== OWN_V ? o.self : ''; }
    } catch (e) { /* offline, or opened unbuilt: what is loaded stays */ }
    refresh(back);
  }

  // ---- the frames
  const live = {};                                   // frame name -> its iframe, once its tab has been opened
  function flush() {                                 // the outline writes its state a moment after a change, and at once when told it is being left
    for (const f of Object.values(live)) { try { f.contentWindow.dispatchEvent(new Event('pagehide')); } catch (e) { /* not loaded yet */ } }
  }
  function drop() { for (const k of Object.keys(live)) { live[k].remove(); delete live[k]; } }
  function point(name) {                             // load a frame, or load it again, from the newest published copy of its page
    const f = live[name], to = at(FRAMES[name].src());
    f.dataset.at = to; f.src = to;
  }
  function dress(name) {                             // a tool inside the notebook drops what the notebook's bar already says (its own sheet knows .embedded)
    try {
      live[name].contentDocument.documentElement.classList.add('embedded');
      for (const t of HANDS) live[name].contentWindow.addEventListener(t, touch, { capture: true, passive: true });
    } catch (e) { /* a frame that cannot be reached is shown as it is */ }
    inner();
    if (name === 'cost') followNow();
  }
  function inner() {                                 // a tool with views of its own (the outline's Magnetometers) has a tab here for each
    const tab = TABS.find((t) => t.id === nb.tab), f = live[tab.frame];
    if (!tab.inner || !f) return;
    try { const b = f.contentDocument.getElementById(tab.inner); if (b && b.getAttribute('aria-selected') !== 'true') b.click(); } catch (e) { /* still loading: dress() calls this again */ }
  }
  function show(id) {
    const tab = TABS.find((t) => t.id === id) || TABS[0];
    nb.tab = tab.id;
    for (const b of $('tabs').children) {
      b.setAttribute('aria-selected', String(b.dataset.tab === tab.id));
      if (b.dataset.tab === tab.id) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });     // on a phone the row of tabs is wider than the screen
    }
    $('copper-box').hidden = tab.frame !== 'routing';
    if (!live[tab.frame]) {
      const f = document.createElement('iframe');
      f.title = FRAMES[tab.frame].title;
      f.addEventListener('load', () => dress(tab.frame));
      live[tab.frame] = f;
      point(tab.frame);
      $('frames').appendChild(f);
    }
    for (const [name, f] of Object.entries(live)) f.hidden = name !== tab.frame;
    inner();
    if (tab.frame === 'cost') { flush(); followNow(); }      // the outline may have changed a moment ago and not written it yet
    try { live[tab.frame].contentWindow.dispatchEvent(new Event('resize')); } catch (e) { /* not loaded yet */ }   // a view sized while hidden measures again
    history.replaceState(null, '', '#' + tab.id);
    keep();
  }

  // ---- the pages
  function putAway() {                               // the open page's entry, brought up to what the tools hold
    flush();
    const was = nb.pages[nb.current], now = snapshot(was);
    if (was && S.sig(was) === S.sig(now)) now.t = was.t;      // nothing changed: it is still the same version
    if (was && was.s != null) now.s = was.s;
    nb.pages[nb.current] = now;
  }
  const forget = (name) => { const p = nb.pages[name]; if (p && p.s != null) nb.gone[name] = { s: p.s }; delete nb.pages[name]; };   // the account is told at the next sync
  function open(name, words) {                       // name is a page already in nb.pages, and not the one held now
    const page = nb.pages[name];
    drop();                                          // the tools go first, so that none writes its old state over the new
    const write = () => { for (const k of KEYS) put(k, page.keys[k]); };
    write();
    nb.current = name; nb.copper = page.copper;
    keep(); list();
    setTimeout(() => { write(); show(nb.tab); say(words); }, 60);   // written twice: a tool being dropped may still have had its say
  }
  function list() {
    const sel = $('page'); sel.textContent = '';
    for (const n of names()) { const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); }
    sel.value = nb.current;
    $('copper').value = nb.copper;
    $('pg-delete').disabled = names().length < 2;
  }
  let asking = null;                                 // what the field is for: { ok(text), secret }
  function ask(what, button, value, ok, secret) {
    asking = { ok, secret: !!secret };
    $('ask-name').type = secret ? 'password' : 'text'; $('ask-name').maxLength = secret ? 200 : 60;
    $('ask-what').textContent = what; $('ask-ok').textContent = button; $('ask-name').value = value;
    $('pages').hidden = true; $('ask').hidden = false; $('ask-name').focus(); $('ask-name').select();
  }
  function askDone() { asking = null; $('ask-name').value = ''; $('ask').hidden = true; $('pages').hidden = false; }
  function answer() {
    const name = asking.secret ? $('ask-name').value.trim() : cleanName($('ask-name').value);
    if (!name) return say(asking.secret ? 'Paste the key first.' : 'A page needs a name.');
    if (asking.ok(name) !== false) askDone();
  }
  const fresh = (name) => { if (nb.pages[name]) { say('There is already a page named "' + name + '".'); return false; } return true; };
  const suggest = (base) => { let i = 2, n = base; while (nb.pages[n]) n = base + ' ' + i++; return n; };

  function exportAll() {
    putAway(); keep();
    const blob = new Blob([JSON.stringify({ what: 'Jumperless V6 notebook', v: 1, current: nb.current, pages: nb.pages }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'v6-notebook.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    say('Exported ' + names().length + (names().length === 1 ? ' page' : ' pages') + ' as v6-notebook.json.');
  }
  function importText(text) {
    let o; try { o = JSON.parse(text); } catch (e) { return say('That file is not a notebook: it does not read as JSON.'); }
    if (!o || o.what !== 'Jumperless V6 notebook' || !o.pages || typeof o.pages !== 'object') return say('That file is not a V6 notebook.');
    const added = [];
    for (const [raw, p] of Object.entries(o.pages)) {
      const base = cleanName(raw); if (!base) continue;
      const name = nb.pages[base] ? suggest(base + ' (imported)') : base;
      nb.pages[name] = strange(p); added.push(name);
    }
    keep(); list(); later(800);
    say(added.length ? 'Added ' + added.length + (added.length === 1 ? ' page: ' : ' pages: ') + added.join(', ') + '. This page is unchanged.' : 'That notebook has no pages.');
  }

  // ---- the account: the same pages on every device. This device's pages and the account's are merged whenever
  // something changed here, when the page is come back to, and on the Sync button. The key is kept in this browser
  // only (v6nb.key): it is no part of a page or of an export, and it is sent only to this site's own /api/notebook.
  let syncing = false, owed = false, timer = null;
  const stamp = () => new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const later = (ms) => { if (!get(KEY)) return; clearTimeout(timer); timer = setTimeout(() => syncNow(false), ms); };
  const call = async (method, body) => {
    const r = await fetch(API, { method, cache: 'no-store', body: body ? JSON.stringify(body) : undefined,
      headers: { authorization: 'Bearer ' + get(KEY), ...(body ? { 'content-type': 'application/json' } : {}) } });
    let o = null; try { o = await r.json(); } catch (e) { /* not JSON: not this site's service */ }
    return { status: r.status, body: o || {} };
  };
  // what the account sent, read the way a file is: only what a notebook holds
  const theirs = (o) => {
    if (!o || typeof o !== 'object') return null;
    const pages = {}, gone = {};
    for (const [raw, pg] of Object.entries(o.pages && typeof o.pages === 'object' ? o.pages : {})) { const n = cleanName(raw); if (n) pages[n] = strange(pg); }
    for (const [raw, g] of Object.entries(o.gone && typeof o.gone === 'object' ? o.gone : {})) { const n = cleanName(raw); if (n && g) gone[n] = { t: Number(g.t) || 0 }; }
    return { pages, gone };
  };
  function mark(last) {                              // the Sync button says whether this device syncs
    const on = !!get(KEY);
    $('nb-sync').textContent = on ? 'Sync on' : 'Sync';
    $('nb-sync').title = on ? 'This device keeps the same pages as your account. Press to sync now.' + (last ? ' Last: ' + last + '.' : '')
      : 'Keep the same pages on every device: paste the notebook key once, and this device and your account share them.';
    $('nb-sync-off').hidden = !on;
  }
  function busy(on) {                                // while a sync is out, the pages are not rearranged under it
    for (const id of ['page', 'pg-copy', 'pg-blank', 'pg-rename', 'pg-delete', 'nb-import']) $(id).disabled = on;
    if (!on) $('pg-delete').disabled = names().length < 2;
  }
  // The merge is in, and the account has it: this device takes it. The tools hold the open page, so that one needs care.
  function settle(m, before, asked, sent) {
    const was = nb.current, held = nb.pages[was], said = [];
    nb.pages = m.pages; nb.gone = {};
    let reload = null;
    const copy = m.kept.find((k) => k[0] === was);
    if (copy) nb.current = copy[1];                  // both changed the open page: the tools hold this device's, now under the copy's name
    else if (m.took.includes(was) || m.dropped.includes(was)) {
      flush();
      if (S.sig(snapshot(held)) !== before) {        // changed here in the moment the answer was on its way: kept the same way
        const as = suggest(was + ' (this device ' + stamp() + ')');
        nb.pages[as] = snapshot(held); nb.current = as; m.kept.push([was, as]); owed = true;
      } else if (m.took.includes(was)) reload = was;
      else if (names().length) reload = names()[0];
      else { nb.pages[was] = snapshot(held); owed = true; }      // every page was deleted elsewhere: what is open stays, as a new page
    }
    const q = (n) => '"' + n + '"';
    const others = m.took.filter((n) => !m.kept.some((k) => k[0] === n));
    if (others.length) said.push('took ' + others.map(q).join(', ') + ' from your account');
    for (const [n, as] of m.kept) said.push('both had changed ' + q(n) + ': the account\'s keeps the name and this device\'s is kept as ' + q(as));
    if (m.dropped.length) said.push('removed ' + m.dropped.map(q).join(', ') + ', deleted on another device');
    keep(); list(); mark(stamp());
    const words = said.length ? 'Synced: ' + said.join('; ') + '.' : asked ? 'Synced: ' + names().length + (names().length === 1 ? ' page' : ' pages') + (sent ? ', this device\'s changes sent.' : ', nothing to change.') : null;
    if (reload) open(reload, words || 'Synced: opened ' + q(reload) + ' as your account has it.');
    else if (words) say(words);
  }
  async function syncNow(asked) {
    if (!get(KEY)) return;
    if (syncing) { owed = true; return; }
    syncing = true; owed = false; clearTimeout(timer); busy(true);
    try {
      let there = await call('GET');
      for (let round = 0; ; round++) {
        if (there.status === 401) { put(KEY, null); mark(); return say('The account refused the key, so sync is off on this device. Press Sync to paste it again.'); }
        if (there.status === 503) return say('Sync: no key is set on the server yet.');
        if (there.status !== 200 && there.status !== 409) throw new Error('the server answered ' + there.status);
        putAway();
        const before = S.sig(nb.pages[nb.current]);
        const m = S.merge({ pages: nb.pages, gone: nb.gone }, theirs(there.body.notebook), stamp(), Date.now());
        if (m.push) {
          const sent = await call('PUT', { base: there.body.rev, notebook: m.remote });
          if (sent.status === 409 && round < 4) { there = sent; continue; }      // another device wrote in between: merged again with what it wrote
          if (sent.status === 413) return say('Sync: the notebook is too big for the account. Export it, then delete pages you no longer need.');
          if (sent.status !== 200) throw new Error('the server answered ' + sent.status);
        }
        return settle(m, before, asked, m.push);
      }
    } catch (e) {
      say('Sync did not get through (' + ((e && e.message) || e) + '). It tries again at the next change.');
    } finally {
      syncing = false; busy(false);
      if (owed) later(1000);
    }
  }

  // ---- wiring
  load();
  for (const t of TABS) {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.tab = t.id; b.textContent = t.name;
    b.addEventListener('click', () => show(t.id));
    $('tabs').appendChild(b);
  }
  for (const c of COPPER) { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; $('copper').appendChild(o); }
  $('copper').addEventListener('change', () => {
    nb.copper = $('copper').value;
    if (live.routing) point('routing');
    keep(); later(800); say('Routing shows ' + $('copper').selectedOptions[0].textContent + '. This page remembers it.');
  });
  $('page').addEventListener('change', () => {
    const to = $('page').value, from = nb.current;
    if (!nb.pages[to] || to === from) return;
    putAway();
    open(to, 'Put "' + from + '" away as it was and opened "' + to + '".'); later(800);
  });
  $('pg-copy').addEventListener('click', () => ask('copy this page as', 'Copy', suggest(nb.current + ' copy'), (name) => {
    if (!fresh(name)) return false;
    const from = nb.current;
    putAway(); nb.pages[name] = snapshot(nb.pages[from]); nb.current = name; keep(); list(); later(800);     // the tools already hold it: nothing reloads
    say('"' + name + '" is a copy of "' + from + '" and is the page open now. "' + from + '" stays as it was.');
  }));
  $('pg-blank').addEventListener('click', () => ask('new blank page', 'Make', suggest('Page ' + (names().length + 1)), (name) => {
    if (!fresh(name)) return false;
    const from = nb.current;
    putAway();
    nb.pages[name] = clean({ t: Date.now(), copper: COPPER[0].id });
    open(name, 'Put "' + from + '" away and opened "' + name + '", with every tool at its built-in design.'); later(800);
  }));
  $('pg-rename').addEventListener('click', () => ask('rename this page', 'Rename', nb.current, (name) => {
    if (name === nb.current) return;
    if (!fresh(name)) return false;
    const from = nb.current, pages = {}, old = nb.pages[from];
    if (old.s != null) nb.gone[from] = { s: old.s };                                    // to the account the old name is deleted and the new one is new
    for (const [n, p] of Object.entries(nb.pages)) pages[n === from ? name : n] = n === from ? strange(p) : p;     // it keeps its place in the list
    nb.pages = pages; nb.current = name; keep(); list(); later(800);
    say('"' + from + '" is now "' + name + '".');
  }));
  $('pg-delete').addEventListener('click', () => {
    if (names().length < 2) return say('The only page cannot be deleted.');
    const gone = nb.current;
    ask('type the name to delete it', 'Delete', '', (name) => {
      if (name !== gone) { say('That is not this page\'s name ("' + gone + '"). Nothing was deleted.'); return false; }
      forget(gone);
      open(names()[0], 'Deleted "' + gone + '" and opened "' + names()[0] + '".'); later(800);
    });
    say('Deleting "' + gone + '" cannot be undone. Export first to keep a copy.');
  });
  $('ask-ok').addEventListener('click', answer);
  $('ask-no').addEventListener('click', () => { askDone(); say(''); });
  $('ask-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') answer(); else if (e.key === 'Escape') { askDone(); say(''); } });
  $('nb-export').addEventListener('click', exportAll);
  $('nb-import').addEventListener('click', () => $('nb-file').click());
  $('nb-file').addEventListener('change', () => {
    const file = $('nb-file').files[0]; if (!file) return;
    if (file.size > 20e6) { $('nb-file').value = ''; return say('That file is too big to be a notebook.'); }
    file.text().then(importText).finally(() => { $('nb-file').value = ''; });
  });
  $('linked').checked = nb.linked;
  $('linked').addEventListener('change', () => {
    nb.linked = $('linked').checked; keep();
    say(nb.linked ? 'Linked: the cost explorer takes its display, window, port and magnetometer count from the outline.' : 'Not linked: the cost explorer keeps what you set in it, whatever the outline has.');
    if (nb.linked) { flush(); followNow(); }
  });
  window.addEventListener('storage', (e) => {             // a tool, in its frame, has written a change
    if (e.key === 'v6mech.state') followNow();
    // a sync is due a few seconds after the last real change. The outline writes again whenever it is told it is being
    // left (a sync tells it so), with only its time stamp new: that is not a change, and must not ask for another sync.
    if (KEYS.includes(e.key) && S.sig({ keys: { [e.key]: e.newValue } }) !== S.sig({ keys: { [e.key]: e.oldValue } })) later(4000);
  });
  $('nb-sync').addEventListener('click', () => {
    if (get(KEY)) return syncNow(true);
    ask('paste the notebook key', 'Use', '', (key) => {
      if (key.length < 24) { say('That is too short to be the key: it is 24 characters or more.'); return false; }
      if (!put(KEY, key)) { say('This browser will not keep the key, so it cannot sync.'); return false; }
      mark(); say('Asking your account...'); syncNow(true);
    }, true);
    say('The key is kept in this browser only and is sent only to this site.');
  });
  $('nb-sync-off').addEventListener('click', () => { put(KEY, null); clearTimeout(timer); mark(); say('Sync is off on this device. Its pages stay here, and the account keeps its own.'); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { later(300); check(true); } else syncNow(false); });
  setInterval(() => { if (document.visibilityState === 'visible') check(false); }, 60000);
  setInterval(() => refresh(false), 5000);            // what was held back for a hand comes in once the hand is gone
  window.addEventListener('pagehide', () => { putAway(); keep(); });
  window.addEventListener('hashchange', () => { const want = location.hash.slice(1); if (want !== nb.tab && TABS.some((t) => t.id === want)) show(want); });

  list();
  mark();
  // The first tool waits a moment for the versions, so that it is loaded once, and as the newest copy.
  Promise.race([check(true), new Promise((done) => setTimeout(done, 2500))]).then(() => {
    show(nb.tab);
    if (/[?&]check\b/.test(location.search)) {          // the link's reading of a design, tried on four made-up ones
      const t = (params, want) => JSON.stringify(facts(params)) === JSON.stringify(want);
      const ok = t({ parts: [{ type: 'display_tft220bar', window: {} }, { type: 'm2_socket' }], show: { sensor_layout: 'custom' }, mag: { list: [1, 2, 3] } }, { disp: 'bar22', win: 'glass', port: 'm2', nmag: 3 })
        && t({ parts: [{ type: 'display_tft147', window: { glass: 0 } }], show: { sensor_layout: 'plan32' } }, { disp: 'tft', win: 'crop', port: 'pads', nmag: 32 })
        && t({ parts: [{ type: 'display_tft300' }, { type: 'sfp_cage' }], show: { sensor_layout: 'wigledmag' } }, { disp: undefined, win: 'open', port: undefined, nmag: undefined })
        && t({}, { disp: 'none', win: undefined, port: 'pads', nmag: undefined });
      return say('Link check: ' + (ok ? 'ok' : 'FAILED'));
    }
    syncNow(false);
    let came = null; try { came = sessionStorage.getItem(NB + '.newer'); if (came === OWN_V) sessionStorage.removeItem(NB + '.newer'); } catch (e) { /* no session storage */ }
    say(!store ? 'This browser will not keep anything for this page (a private window does this): the tabs work, the pages will not last.'
      : (came && came === OWN_V ? 'A newer notebook was published: loaded. ' : '') + 'Page "' + nb.current + '". ' + (names().length === 1 ? 'Copy it to keep this design and try another.' : names().length + ' pages in this notebook.'));
  });
})();
</script>
</body>
</html>
