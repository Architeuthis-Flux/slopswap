<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding P. cyanescens and P. allenii around Monterey</title>
<meta name="short-title" content="Monterey chip-bed guide">
<meta name="description" content="Where wood-chip Psilocybes have been recorded around the Monterey Peninsula, what they need, when they fruit, and a map of likely chip beds.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../styles/jumperless.css">
<style>
  .mapframe{display:block;width:100%;height:78vh;height:78svh;max-height:760px;min-height:460px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .maplinks{display:flex;flex-wrap:wrap;gap:.5rem}
  figure.chart{margin:1.2rem 0}
  figure.chart svg{display:block;width:100%;height:auto;max-width:40rem}
  figure.chart figcaption{color:var(--muted);font-size:.85em;margin-top:.3rem}
  .table-wrap table{min-width:34rem}
  td,th{vertical-align:top}
  ul.leads{list-style:none;padding:0;margin:0 0 1.4em}
  ul.leads li{border-top:1px solid var(--line);padding:.8em 0}
  ul.leads strong{display:block}
  ul.leads .tier{display:block;font-size:.8em;color:var(--muted);margin:.1em 0 .35em}
  ul.leads .tK,ul.leads .tP,ul.leads .tA{color:var(--accent-2)}
  ul.leads .ev{display:block}
  ul.leads small{display:block;color:var(--muted);margin-top:.3rem}
</style>
</head>
<body>
<main class="page">
<p class="eyebrow"><a href="../">slopswap</a> / monterey-chip-beds</p>
<h1>Finding P. cyanescens and P. allenii around Monterey</h1>
<div id="locked"><p class="muted">This page is private. Enter the password to open it.</p></div>
<div id="guide"></div>
</main>
<script src="unlock.js"></script>
<script>
ChipLock.form(document.getElementById('locked'));
ChipLock.ready.then(function(){ return ChipLock.read('guide'); }).then(function(html){
  document.getElementById('locked').remove();
  var g=document.getElementById('guide'); g.innerHTML=html;
  g.addEventListener('click',function(e){
    var a=e.target.closest('a[data-kml]'); if(!a) return;
    e.preventDefault();
    ChipLock.read('spots-kml').then(function(t){
      var u=URL.createObjectURL(new Blob([t],{type:'application/vnd.google-earth.kml+xml'})),d=document.createElement('a');
      d.href=u; d.download='monterey-chip-bed-spots.kml'; document.body.appendChild(d); d.click(); d.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},1000);
    });
  });
});
</script>
</body>
</html>
